<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Builder Atlas — AI 建造者阅读档案：30 份来源可追溯的档案</title>
  <desc id="desc">编辑纸面风标题：Builder Atlas，AI 建造者阅读档案；右侧是四份专题复核档案卡片：Zara Zhang、Matt Pocock、Emil Kowalski、Andrej Karpathy。</desc>

  <rect width="1200" height="360" rx="26" fill="#f8f9f6"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#b3341a">AI BUILDER READING ATLAS · 研究更新 2026-10-04</text>
    <text x="56" y="128" font-size="58" font-weight="700" fill="#17201d">Builder Atlas</text>
    <text x="56" y="168" font-size="23" fill="#17201d">AI 建造者阅读档案</text>
    <text x="56" y="204" font-size="19" fill="#52615a">先读本人材料，再判断代表性。</text>
    <g id="chips" font-size="18" fill="#17201d" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#dce1da" stroke-width="1.5"/><text x="119" y="262">30 份档案</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#dce1da" stroke-width="1.5"/><text x="257" y="262">102 条观点</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#dce1da" stroke-width="1.5"/><text x="395" y="262">89 份材料</text></g>
      <g><rect x="470" y="238" width="150" height="36" rx="18" fill="#17201d"/><text x="545" y="262" fill="#f8f9f6">6 条阅读路线</text></g>
    </g>
  </g>

  <g id="profiles" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="profile-shapes">
      <rect x="780" y="44" width="360" height="272" rx="8" fill="#ffffff" stroke="#dce1da" stroke-width="1.5"/>
      <rect x="804" y="96" width="312" height="1" fill="#dce1da"/>
      <rect x="1036" y="112" width="80" height="28" rx="4" fill="#dcfce7"/>
      <rect x="1036" y="158" width="80" height="28" rx="4" fill="#dcfce7"/>
      <rect x="1036" y="204" width="80" height="28" rx="4" fill="#dcfce7"/>
      <rect x="1036" y="250" width="80" height="28" rx="4" fill="#dcfce7"/>
      <rect x="804" y="286" width="312" height="1" fill="#dce1da"/>
    </g>
    <g id="profile-labels">
      <text x="804" y="80" font-size="19" font-weight="700" fill="#17201d">四份专题档案</text>
      <text x="804" y="134" font-size="19" fill="#17201d">Zara Zhang</text>
      <text x="1076" y="132" font-size="18" fill="#166534" text-anchor="middle">专题复核</text>
      <text x="804" y="180" font-size="19" fill="#17201d">Matt Pocock</text>
      <text x="1076" y="178" font-size="18" fill="#166534" text-anchor="middle">专题复核</text>
      <text x="804" y="226" font-size="19" fill="#17201d">Emil Kowalski</text>
      <text x="1076" y="224" font-size="18" fill="#166534" text-anchor="middle">专题复核</text>
      <text x="804" y="272" font-size="19" fill="#17201d">Andrej Karpathy</text>
      <text x="1076" y="270" font-size="18" fill="#166534" text-anchor="middle">专题复核</text>
      <text x="804" y="308" font-size="18" fill="#52615a">其余 26 份为初步整理，均标注来源与边界</text>
    </g>
  </g>
</svg>
